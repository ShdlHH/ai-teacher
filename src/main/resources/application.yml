server:
  port: 8080

spring:
  application:
    name: ai-teacher
  datasource:
    url: jdbc:mysql://localhost:3306/ai_teacher?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB
  ai:
    ollama:
      base-url: http://localhost:11434
      chat:
        options:
          model: qwen3:8b
          temperature: 0.7
          # RAG 资料 + 历史消息较长，需大于 Ollama 默认上下文
          num-ctx: 8192
      embedding:
        options:
          # 本地已安装的向量模型，用于知识库检索
          model: nomic-embed-text

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    banner: false

jwt:
  # 开发用密钥（至少 32 字节），生产环境务必更换
  secret: ai-teacher-dev-secret-key-change-me-in-production-0123456789
  expire-hours: 72

ai:
  teacher:
    # 多轮上下文最多携带的历史消息条数
    history-limit: 20
    # 向量库 JSON 落盘路径（相对项目运行目录）
    vector-store-path: data/vector-store.json
    quiz:
      model: qwen3:8b
      # 出题/批改使用低温度，保证 JSON 结构稳定
      temperature: 0.2
    rag:
      # 检索返回的片段数
      top-k: 5
      # 相似度阈值（0-1）
      similarity-threshold: 0.5
      # 拼接进提示词的资料最大字符数
      max-context-chars: 7000

logging:
  level:
    com.example.aiteacher: debug
