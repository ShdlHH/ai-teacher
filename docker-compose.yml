services:
  pgvector:
    image: pgvector/pgvector:pg16
    container_name: ai-teacher-pgvector
    environment:
      POSTGRES_DB: ai_teacher_vector
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgvector-data:/var/lib/postgresql/data

volumes:
  pgvector-data:
